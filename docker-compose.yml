version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mcp
      POSTGRES_PASSWORD: mcp
      POSTGRES_DB: multicloud
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: ./api
    env_file: ./api/.env
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
      - ./terraform:/terraform

  worker:
    build: ./api
    command: celery -A app.core.celery_app worker --loglevel=info
    env_file: ./api/.env
    depends_on:
      - postgres
      - redis
    volumes:
      - ./api:/app
      - ./terraform:/terraform

  beat:
    build: ./api
    command: celery -A app.core.celery_app beat --loglevel=info
    env_file: ./api/.env
    depends_on:
      - postgres
      - redis
    volumes:
      - ./api:/app
      - ./terraform:/terraform

volumes:
  pgdata:
